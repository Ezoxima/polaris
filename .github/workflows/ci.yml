name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    name: Python ${{ matrix.python }} sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer les outils de développement
        run: python -m pip install pytest ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format (ruff format)
        run: ruff format --check .
      - name: Commandes générées à jour
        run: python outils/generer_commandes.py --verifier
      - name: Tests
        run: python -m pytest -q
