[project]
name = "polaris"
version = "0.3.1"
description = "Orchestrateur conversationnel de projets pour Claude Code et GitHub Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gwenael Cochet" }]
# Aucune dépendance à l'exécution : les outils n'utilisent que la bibliothèque standard.
dependencies = []
# Outils de développement : requirements-dev.txt (versions fixées, une seule source).

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["outils", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Les messages et gabarits en français dépassent parfois la largeur : le formateur gère le code, pas la prose.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["outils"]
